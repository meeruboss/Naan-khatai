<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naan-khatai</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Naan-khatai</h1>
        <div class="tag">Catch the cookies before they hit the grass</div>
      </div>
      <div class="scoreboard" aria-label="Score">
        <div class="scorebox" id="score">0</div>
        <div class="scorebox" id="best">Best 0</div>
        <div class="scorebox" id="misses">Miss 0/3</div>
      </div>
    </header>

    <section class="game-wrap" aria-label="Naan-khatai game">
      <canvas id="game" width="480" height="720"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="overlayTitle">Naan-khatai</h2>
          <p id="overlayText">Hold the left or right half of the screen to move.</p>
          <button id="startButton" type="button">Start Eating</button>
        </div>
      </div>
    </section>

    <footer>
      <span>Hold left / right to move</span>
      <span>Best score saved here</span>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
