<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naan-khatai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Naan-khatai game">
      <section class="hud" aria-label="Game status">
        <div>
          <span class="hud-label">Score</span>
          <strong id="score">0</strong>
        </div>
        <h1>Naan-khatai</h1>
        <div>
          <span class="hud-label">Misses</span>
          <strong><span id="misses">0</span>/3</strong>
        </div>
      </section>

      <canvas id="game" width="960" height="600" aria-label="Playable game canvas"></canvas>

      <section class="controls" aria-label="Touch controls">
        <button id="leftButton" type="button" aria-label="Move left">‹</button>
        <button id="startButton" type="button">Start</button>
        <button id="rightButton" type="button" aria-label="Move right">›</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
